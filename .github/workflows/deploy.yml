# 푸시할 때마다 시험(node 의 Pyodide 로 레슨 재현) → 빌드(문법·저작권 점검 포함) → 빌드 결과 점검을 거쳐
# GitHub Pages 로 올린다(dist 는 커밋하지 않는다). 시험이 깨지면 배포도 멈춘다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 빌드 결과 점검
        run: |
          size=$(wc -c < dist/index.html)
          echo "dist/index.html: $size bytes"
          test "$size" -gt 200000
          test "$(grep -o 티쳐무 dist/index.html | wc -l)" -ge 3
          grep -q 'cdn.jsdelivr.net/pyodide/v' dist/index.html
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
